name: Release on Main

# A merge into main is a release. The version comes from the last vX.Y.Z tag and the commit
# subjects since it (Get-ReleaseVersion in Scripts/_common.ps1, which build.ps1 uses too): a feat:
# raises Minor, anything else Build, and Directory.Build.props is a floor for a jump. Nothing is
# committed back; the merge commit gets the tag and a GitHub Release carrying the zip.
#
# Two jobs, so the restore and the build - third-party MSBuild code - never run with the workflow
# token's write rights. Only the release job, which builds nothing, gets contents: write. The build
# still sees PACKAGES_PAT for the GitHub Packages feed, so that secret should be read:packages only.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      last_tag: ${{ steps.version.outputs.last_tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # The whole history and every tag: the version is counted from the last release tag.
        fetch-depth: 0
        persist-credentials: false

    - name: Work out the version
      id: version
      shell: pwsh
      run: |
        . ./Scripts/_common.ps1
        Assert-ReleaseMerge
        $release = Get-ReleaseVersion
        if (-not $release.New) {
            Write-Host "Nothing new since $($release.LastTag) - no release."
            "release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
        }
        $full = "$($release.Version).$env:GITHUB_RUN_NUMBER"
        "release=true"                 | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "tag=v$($release.Version)"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "last_tag=$($release.LastTag)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "version=$full"                | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        Write-Host "Releasing v$($release.Version) as $full (last release: $(if ($release.LastTag) { $release.LastTag } else { 'none' }))"

    - name: Setup .NET 10
      if: steps.version.outputs.release == 'true'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Stamp the version (not committed)
      if: steps.version.outputs.release == 'true'
      shell: pwsh
      run: |
        $propsFile = "Directory.Build.props"
        $content = Get-Content $propsFile -Raw
        if ($content -notmatch '<Version>\d+\.\d+\.\d+\.\d+</Version>') {
            Write-Error "Could not find a four-part <Version> in $propsFile"
            exit 1
        }
        $content = $content -replace '<Version>\d+\.\d+\.\d+\.\d+</Version>', "<Version>${{ steps.version.outputs.version }}</Version>"
        Set-Content -Path $propsFile -Value $content -NoNewline

    - name: Restore dependencies
      if: steps.version.outputs.release == 'true'
      run: dotnet restore
      env:
        GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_PAT }}

    - name: Publish (single-file zip)
      if: steps.version.outputs.release == 'true'
      shell: pwsh
      run: .\publish.ps1 -SkipDatabasePrompt -NoBump
      env:
        GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_PAT }}

    # Only a hand-over to the release job; the GitHub Release is where the zip is kept. A week, so
    # "Re-run failed jobs" on a release that failed still finds it; overwrite, so "Re-run all jobs"
    # can upload it again under the same name.
    - name: Hand the zip to the release job
      if: steps.version.outputs.release == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: release-zip
        path: diffusion_nexus.V${{ steps.version.outputs.version }}.zip
        if-no-files-found: error
        overwrite: true
        retention-days: 7

  # After the build, so a failed build leaves no tag behind and a re-run gets the same version.
  release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Fetch the zip
      uses: actions/download-artifact@v4
      with:
        name: release-zip

    - name: Tag and publish the GitHub Release
      run: |
        notes=(--generate-notes)
        if [ -n "$LAST_TAG" ]; then notes+=(--notes-start-tag "$LAST_TAG"); fi
        gh release create "$TAG" "diffusion_nexus.V$VERSION.zip" \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --title "DiffusionNexus $TAG" \
          "${notes[@]}"
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ needs.build.outputs.tag }}
        LAST_TAG: ${{ needs.build.outputs.last_tag }}
        VERSION: ${{ needs.build.outputs.version }}
