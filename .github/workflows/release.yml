name: Release on Main

# A merge into main is a release. The version comes from the last vX.Y.Z tag and the commit
# subjects since it (Get-ReleaseVersion in Scripts/_common.ps1, which build.ps1 uses too): a feat:
# raises Minor, anything else Build, and Directory.Build.props is a floor for a jump. Nothing is
# committed back; the merge commit gets the tag and a GitHub Release carrying the zip.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # The whole history and every tag: the version is counted from the last release tag.
        fetch-depth: 0

    - name: Work out the version
      id: version
      shell: pwsh
      run: |
        . ./Scripts/_common.ps1
        $release = Get-ReleaseVersion
        if (-not $release.New) {
            Write-Host "Nothing new since $($release.LastTag) - no release."
            "release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
        }
        $full = "$($release.Version).$env:GITHUB_RUN_NUMBER"
        "release=true"                | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "tag=v$($release.Version)"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "last_tag=$($release.LastTag)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "version=$full"               | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        Write-Host "Releasing v$($release.Version) as $full (last release: $(if ($release.LastTag) { $release.LastTag } else { 'none' }))"

    - name: Setup .NET 10
      if: steps.version.outputs.release == 'true'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Stamp the version (not committed)
      if: steps.version.outputs.release == 'true'
      shell: pwsh
      run: |
        $propsFile = "Directory.Build.props"
        $content = Get-Content $propsFile -Raw
        if ($content -notmatch '<Version>\d+\.\d+\.\d+\.\d+</Version>') {
            Write-Error "Could not find a four-part <Version> in $propsFile"
            exit 1
        }
        $content = $content -replace '<Version>\d+\.\d+\.\d+\.\d+</Version>', "<Version>${{ steps.version.outputs.version }}</Version>"
        Set-Content -Path $propsFile -Value $content -NoNewline

    - name: Restore dependencies
      if: steps.version.outputs.release == 'true'
      run: dotnet restore
      env:
        GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_PAT }}

    - name: Publish (single-file zip)
      if: steps.version.outputs.release == 'true'
      shell: pwsh
      run: .\publish.ps1 -SkipDatabasePrompt -NoBump
      env:
        GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_PAT }}

    # Last, so a failed build leaves no tag behind and a re-run gets the same version.
    - name: Tag and publish the GitHub Release
      if: steps.version.outputs.release == 'true'
      shell: pwsh
      run: |
        $notes = @('--generate-notes')
        if ('${{ steps.version.outputs.last_tag }}') { $notes += @('--notes-start-tag', '${{ steps.version.outputs.last_tag }}') }
        gh release create '${{ steps.version.outputs.tag }}' 'diffusion_nexus.V${{ steps.version.outputs.version }}.zip' `
            --target $env:GITHUB_SHA `
            --title 'DiffusionNexus ${{ steps.version.outputs.tag }}' `
            @notes
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      env:
        GH_TOKEN: ${{ github.token }}
